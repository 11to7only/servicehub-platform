server:
  port: 8081

spring:
  application:
    name: user-service

  flyway:
    table: flyway_schema_history_user

  datasource:
    url: jdbc:mysql://localhost:3307/userdb
    username: appuser
    password: apppass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0  # capture all requests

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Circuit Breaker, limiter, timeout
resilience4j:
  circuitbreaker:
    instances:
      userServiceCB:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      userServiceRetry:
        maxAttempts: 3
        waitDuration: 2s

  timelimiter:
    instances:
      userServiceTimeout:
        timeoutDuration: 3s

logging:
  pattern:
    level: "%5p [${spring.application.name}, traceId=%X{traceId}, spanId=%X{spanId}]"